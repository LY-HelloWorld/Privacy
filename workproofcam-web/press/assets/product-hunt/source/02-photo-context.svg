<!-- Product Hunt slide entry: explain which optional job-context fields travel with each captured photo. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1270" height="760" viewBox="0 0 1270 760" role="img" aria-labelledby="title desc">
  <title id="title">Keep the job context with every photo</title>
  <desc id="desc">Timestamp, optional GPS, address, and notes beside a real WorkProofCam capture screen.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf3f7"/><stop offset="1" stop-color="#d9e8f0"/></linearGradient><filter id="shadow" x="-50%" y="-30%" width="200%" height="190%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#17394d" flood-opacity=".3"/></filter></defs>
  <rect width="1270" height="760" rx="34" fill="url(#bg)"/>
  <rect x="0" y="0" width="395" height="760" rx="34" fill="#102c44"/>
  <image x="64" y="58" width="64" height="64" xlink:href="../../app-icon-1024.png"/>
  <text x="146" y="99" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="700">WorkProofCam</text>
  <text x="64" y="214" fill="#8fd7f4" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">CAPTURE ON SITE</text>
  <text x="62" y="280" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="47" font-weight="750"><tspan x="62">Keep the</tspan><tspan x="62" dy="55">job context</tspan><tspan x="62" dy="55">with the photo.</tspan></text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#d8e7ee">
    <circle cx="76" cy="491" r="6" fill="#eda53d"/><text x="96" y="498">Timestamp</text>
    <circle cx="76" cy="544" r="6" fill="#eda53d"/><text x="96" y="551">Optional GPS</text>
    <circle cx="76" cy="597" r="6" fill="#eda53d"/><text x="96" y="604">Address context</text>
    <circle cx="76" cy="650" r="6" fill="#eda53d"/><text x="96" y="657">Photo notes</text>
  </g>
  <rect x="499" y="64" width="304" height="650" rx="55" fill="#0a1721" filter="url(#shadow)"/>
  <rect x="514" y="79" width="274" height="620" rx="43" fill="#ffffff"/>
  <image x="524" y="89" width="254" height="600" preserveAspectRatio="xMidYMid slice" xlink:href="../../screens/screen-2.png"/>
  <g font-family="Helvetica,Arial,sans-serif">
    <rect x="870" y="132" width="326" height="112" rx="22" fill="#ffffff" opacity=".95"/><text x="902" y="177" fill="#1f5f87" font-size="18" font-weight="700">WHEN</text><text x="902" y="211" fill="#183045" font-size="25" font-weight="700">Timestamp at capture</text>
    <rect x="870" y="274" width="326" height="112" rx="22" fill="#ffffff" opacity=".95"/><text x="902" y="319" fill="#1f5f87" font-size="18" font-weight="700">WHERE</text><text x="902" y="353" fill="#183045" font-size="25" font-weight="700">GPS when permitted</text>
    <rect x="870" y="416" width="326" height="112" rx="22" fill="#ffffff" opacity=".95"/><text x="902" y="461" fill="#1f5f87" font-size="18" font-weight="700">WHAT</text><text x="902" y="495" fill="#183045" font-size="25" font-weight="700">A note tied to the image</text>
    <text x="871" y="626" fill="#526c7b" font-size="20">Review time and location details</text><text x="871" y="655" fill="#526c7b" font-size="20">before sharing a report.</text>
  </g>
</svg>
