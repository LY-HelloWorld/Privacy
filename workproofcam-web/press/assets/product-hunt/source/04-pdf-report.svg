<!-- Product Hunt slide entry: present the PDF as the reviewed delivery format, not as a legal certificate. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1270" height="760" viewBox="0 0 1270 760" role="img" aria-labelledby="title desc">
  <title id="title">Export one client-ready PDF report</title>
  <desc id="desc">Real WorkProofCam PDF screen beside a stylized report page.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef4f7"/><stop offset="1" stop-color="#d9e6ed"/></linearGradient><filter id="shadow" x="-50%" y="-30%" width="200%" height="190%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#17394d" flood-opacity=".3"/></filter></defs>
  <rect width="1270" height="760" rx="34" fill="url(#bg)"/>
  <image x="64" y="54" width="64" height="64" xlink:href="../../app-icon-1024.png"/>
  <text x="146" y="95" fill="#173b56" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="700">WorkProofCam</text>
  <text x="64" y="198" fill="#1f648d" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">REVIEW AND DELIVER</text>
  <text x="62" y="270" fill="#122d42" font-family="Helvetica,Arial,sans-serif" font-size="54" font-weight="750"><tspan x="62">One clear PDF.</tspan><tspan x="62" dy="63">Ready to share.</tspan></text>
  <text x="64" y="421" fill="#506c7b" font-family="Helvetica,Arial,sans-serif" font-size="23">Photos, job details, notes, and time.</text><text x="64" y="453" fill="#506c7b" font-family="Helvetica,Arial,sans-serif" font-size="23">Optional location context when permitted.</text>
  <rect x="64" y="518" width="325" height="62" rx="31" fill="#eda53d"/>
  <text x="226" y="558" text-anchor="middle" fill="#173143" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="750">Share with the iOS sheet</text>
  <rect x="495" y="72" width="290" height="638" rx="52" fill="#0a1721" filter="url(#shadow)"/>
  <rect x="510" y="87" width="260" height="608" rx="40" fill="#ffffff"/>
  <image x="520" y="97" width="240" height="588" preserveAspectRatio="xMidYMid slice" xlink:href="../../screens/screen-3.png"/>
  <g transform="translate(858 122) rotate(3 155 245)" filter="url(#shadow)">
    <rect width="310" height="492" rx="8" fill="#ffffff"/>
    <rect x="28" y="32" width="166" height="16" rx="8" fill="#1c5f89"/>
    <rect x="28" y="62" width="252" height="8" rx="4" fill="#c8d6df"/>
    <rect x="28" y="79" width="212" height="8" rx="4" fill="#d9e2e7"/>
    <rect x="28" y="118" width="116" height="124" rx="8" fill="#dbe7ed"/>
    <rect x="166" y="118" width="116" height="124" rx="8" fill="#c4dae5"/>
    <text x="28" y="269" fill="#1d4057" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700">BEFORE</text>
    <text x="166" y="269" fill="#1d4057" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700">AFTER</text>
    <rect x="28" y="294" width="252" height="10" rx="5" fill="#cad8df"/>
    <rect x="28" y="316" width="225" height="8" rx="4" fill="#dce5e9"/>
    <rect x="28" y="337" width="238" height="8" rx="4" fill="#dce5e9"/>
    <rect x="28" y="388" width="120" height="58" rx="8" fill="#eef3f5"/>
    <rect x="160" y="388" width="120" height="58" rx="8" fill="#eef3f5"/>
