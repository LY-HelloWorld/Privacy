<!-- Product Hunt slide entry: map the app's three real photo labels to an understandable work sequence. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1270" height="760" viewBox="0 0 1270 760" role="img" aria-labelledby="title desc">
  <title id="title">Show what changed with Before, After, and General proof</title>
  <desc id="desc">WorkProofCam job screen with a clear three-stage work sequence.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e2a41"/><stop offset="1" stop-color="#14364f"/></linearGradient><filter id="shadow" x="-50%" y="-30%" width="200%" height="190%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#06131e" flood-opacity=".48"/></filter></defs>
  <rect width="1270" height="760" rx="34" fill="url(#bg)"/>
  <circle cx="1100" cy="40" r="320" fill="#eda53d" opacity=".12"/>
  <image x="72" y="54" width="64" height="64" xlink:href="../../app-icon-1024.png"/>
  <text x="154" y="95" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="700">WorkProofCam</text>
  <text x="70" y="204" fill="#8ed6f2" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">ORGANIZE BY JOB</text>
  <text x="68" y="274" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="56" font-weight="750"><tspan x="68">Show what</tspan><tspan x="68" dy="64">changed.</tspan></text>
  <text x="70" y="430" fill="#d7e8ef" font-family="Helvetica,Arial,sans-serif" font-size="24">Keep the sequence understandable</text><text x="70" y="463" fill="#d7e8ef" font-family="Helvetica,Arial,sans-serif" font-size="24">without searching a mixed camera roll.</text>
  <g font-family="Helvetica,Arial,sans-serif" font-weight="700">
    <rect x="70" y="526" width="180" height="70" rx="19" fill="#ffffff"/><text x="160" y="570" text-anchor="middle" fill="#153e5d" font-size="23">BEFORE</text>
    <path d="M260 561h48" stroke="#eda53d" stroke-width="6" stroke-linecap="round"/><path d="M298 551l14 10-14 10" fill="none" stroke="#eda53d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="326" y="526" width="180" height="70" rx="19" fill="#ffffff"/><text x="416" y="570" text-anchor="middle" fill="#153e5d" font-size="23">GENERAL</text>
    <path d="M516 561h48" stroke="#eda53d" stroke-width="6" stroke-linecap="round"/><path d="M554 551l14 10-14 10" fill="none" stroke="#eda53d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="582" y="526" width="180" height="70" rx="19" fill="#eda53d"/><text x="672" y="570" text-anchor="middle" fill="#183045" font-size="23">AFTER</text>
  </g>
  <rect x="902" y="70" width="290" height="642" rx="53" fill="#07141f" filter="url(#shadow)"/>
  <rect x="917" y="85" width="260" height="612" rx="41" fill="#ffffff"/>
  <image x="927" y="95" width="240" height="592" preserveAspectRatio="xMidYMid slice" xlink:href="../../screens/screen-1.png"/>
</svg>
