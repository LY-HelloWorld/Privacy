<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Five photos. One local queue.</title><desc id="desc">Diagram of five photos moving through a shared preset into a review queue.</desc><rect width="1200" height="800" fill="#f6f7f2"/><text x="64" y="65" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0c746d" font-weight="700">CLEARPIX / PHOTO GUIDES</text><text x="64" y="130" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#151817" font-weight="700">Five photos. One local queue.</text><text x="64" y="176" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#59645f" font-weight="500">A shared preset, with individual review.</text><rect x="64" y="240" width="195" height="180" rx="20" fill="#fff" stroke="#d7ddd5"/><rect x="82" y="258" width="159" height="100" rx="10" fill="#dcefeb" stroke="#d7ddd5"/><path d="M94 345l40-50 30 30 25-20 40 40" fill="none" stroke="#0c746d" stroke-width="4"/><text x="84" y="394" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#0c746d" font-weight="700">PHOTO 1</text><rect x="280" y="240" width="195" height="180" rx="20" fill="#fff" stroke="#d7ddd5"/><rect x="298" y="258" width="159" height="100" rx="10" fill="#dcefeb" stroke="#d7ddd5"/><path d="M310 345l40-50 30 30 25-20 40 40" fill="none" stroke="#0c746d" stroke-width="4"/><text x="300" y="394" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#0c746d" font-weight="700">PHOTO 2</text><rect x="496" y="240" width="195" height="180" rx="20" fill="#fff" stroke="#d7ddd5"/><rect x="514" y="258" width="159" height="100" rx="10" fill="#dcefeb" stroke="#d7ddd5"/><path d="M526 345l40-50 30 30 25-20 40 40" fill="none" stroke="#0c746d" stroke-width="4"/><text x="516" y="394" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#0c746d" font-weight="700">PHOTO 3</text><rect x="712" y="240" width="195" height="180" rx="20" fill="#fff" stroke="#d7ddd5"/><rect x="730" y="258" width="159" height="100" rx="10" fill="#dcefeb" stroke="#d7ddd5"/><path d="M742 345l40-50 30 30 25-20 40 40" fill="none" stroke="#0c746d" stroke-width="4"/><text x="732" y="394" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#0c746d" font-weight="700">PHOTO 4</text><rect x="928" y="240" width="195" height="180" rx="20" fill="#fff" stroke="#d7ddd5"/><rect x="946" y="258" width="159" height="100" rx="10" fill="#dcefeb" stroke="#d7ddd5"/><path d="M958 345l40-50 30 30 25-20 40 40" fill="none" stroke="#0c746d" stroke-width="4"/><text x="948" y="394" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#0c746d" font-weight="700">PHOTO 5</text><rect x="64" y="470" width="1072" height="106" rx="20" fill="#151817" stroke="#d7ddd5"/><text x="100" y="513" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a8d8cd" font-weight="700">ONE SHARED PRESET</text><text x="100" y="549" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#fff" font-weight="500">Light  /  Standard  /  Strong</text><path d="M380 628h60m-10 -8 10 8-10 8" fill="none" stroke="#0c746d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="635" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#151817" font-weight="500">Process in sequence</text><text x="475" y="635" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#151817" font-weight="500">Review each result</text><path d="M754 628h50m-10 -8 10 8-10 8" fill="none" stroke="#0c746d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="835" y="635" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#151817" font-weight="500">Save the keepers</text><text x="64" y="725" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#59645f" font-weight="500">Pro feature · Up to 5 photos per queue · Failed items do not stop the rest.</text></svg>