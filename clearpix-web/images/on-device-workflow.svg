<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Your photo stays on your device.</title><desc id="desc">Diagram of choosing, enhancing, comparing and saving photos inside the device boundary.</desc><rect width="1200" height="800" fill="#f6f7f2"/><text x="64" y="65" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0c746d" font-weight="700">CLEARPIX / PHOTO GUIDES</text><text x="64" y="130" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#151817" font-weight="700">Your photo stays on your device.</text><text x="64" y="176" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#59645f" font-weight="500">Photo processing happens locally.</text><rect x="64" y="225" width="1072" height="405" rx="32" fill="#dcefeb" stroke="#0c746d"/><text x="98" y="274" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0c746d" font-weight="700">ON YOUR DEVICE</text><rect x="100" y="335" width="210" height="167" rx="20" fill="#fff" stroke="#d7ddd5"/><text x="124" y="385" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0c746d" font-weight="700">01</text><text x="124" y="445" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#151817" font-weight="500">Choose photo</text><path d="M323 420h25m-10 -8 10 8-10 8" fill="none" stroke="#0c746d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="362" y="335" width="210" height="167" rx="20" fill="#fff" stroke="#d7ddd5"/><text x="386" y="385" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0c746d" font-weight="700">02</text><text x="386" y="445" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#151817" font-weight="500">Enhance locally</text><path d="M585 420h25m-10 -8 10 8-10 8" fill="none" stroke="#0c746d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="624" y="335" width="210" height="167" rx="20" fill="#fff" stroke="#d7ddd5"/><text x="648" y="385" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0c746d" font-weight="700">03</text><text x="648" y="445" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#151817" font-weight="500">Compare</text><path d="M847 420h25m-10 -8 10 8-10 8" fill="none" stroke="#0c746d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="886" y="335" width="210" height="167" rx="20" fill="#fff" stroke="#d7ddd5"/><text x="910" y="385" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0c746d" font-weight="700">04</text><text x="910" y="445" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#151817" font-weight="500">Save a copy</text><text x="98" y="583" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#083f3b" font-weight="700">No photo upload to a cloud AI service.</text><text x="64" y="690" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#59645f" font-weight="500">Separate network services: App Store purchases, analytics and crash diagnostics.</text><text x="64" y="729" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#59645f" font-weight="500">Photo-library cloud sync follows your device settings. See the privacy policy.</text></svg>