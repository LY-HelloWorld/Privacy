<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img"><title>batch queue</title><rect width="600" height="900" fill="#f6f7f2"/><text x="32" y="50" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0c746d" font-weight="700">CLEARPIX / PHOTO GUIDES</text><text x="32" y="107" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#151817" font-weight="700">Five photos.</text><text x="32" y="152" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#151817" font-weight="700">One local queue.</text><rect x="32" y="215" width="96" height="126" rx="20" fill="#dcefeb" stroke="#d7ddd5"/><text x="67" y="288" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#0c746d" font-weight="700">1</text><rect x="142" y="215" width="96" height="126" rx="20" fill="#dcefeb" stroke="#d7ddd5"/><text x="177" y="288" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#0c746d" font-weight="700">2</text><rect x="252" y="215" width="96" height="126" rx="20" fill="#dcefeb" stroke="#d7ddd5"/><text x="287" y="288" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#0c746d" font-weight="700">3</text><rect x="362" y="215" width="96" height="126" rx="20" fill="#dcefeb" stroke="#d7ddd5"/><text x="397" y="288" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#0c746d" font-weight="700">4</text><rect x="472" y="215" width="96" height="126" rx="20" fill="#dcefeb" stroke="#d7ddd5"/><text x="507" y="288" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#0c746d" font-weight="700">5</text><rect x="32" y="395" width="536" height="115" rx="20" fill="#fff" stroke="#d7ddd5"/><text x="58" y="437" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#151817" font-weight="700">Choose one preset</text><text x="58" y="477" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#59645f" font-weight="500">Light / Standard / Strong</text><rect x="32" y="535" width="536" height="115" rx="20" fill="#fff" stroke="#d7ddd5"/><text x="58" y="577" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#151817" font-weight="700">Review each result</text><text x="58" y="617" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#59645f" font-weight="500">Photos process in sequence.</text><rect x="32" y="675" width="536" height="115" rx="20" fill="#fff" stroke="#d7ddd5"/><text x="58" y="717" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#151817" font-weight="700">Save the keepers</text><text x="58" y="757" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#59645f" font-weight="500">Individually or together.</text><text x="32" y="850" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#0c746d" font-weight="700">Pro feature · Up to 5 photos per queue</text></svg>