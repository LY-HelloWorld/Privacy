<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img"><title>on device workflow</title><rect width="600" height="900" fill="#f6f7f2"/><text x="32" y="50" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0c746d" font-weight="700">CLEARPIX / PHOTO GUIDES</text><text x="32" y="107" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#151817" font-weight="700">Your photo stays</text><text x="32" y="152" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#151817" font-weight="700">on your device.</text><rect x="32" y="193" width="536" height="477" rx="20" fill="#dcefeb" stroke="#d7ddd5"/><text x="60" y="239" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0c746d" font-weight="700">LOCAL PHOTO PROCESSING</text><rect x="60" y="265" width="480" height="70" rx="20" fill="#fff" stroke="#d7ddd5"/><text x="80" y="309" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#151817" font-weight="500">01  Choose a local photo</text><rect x="60" y="356" width="480" height="70" rx="20" fill="#fff" stroke="#d7ddd5"/><text x="80" y="400" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#151817" font-weight="500">02  Enhance on the device</text><rect x="60" y="447" width="480" height="70" rx="20" fill="#fff" stroke="#d7ddd5"/><text x="80" y="491" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#151817" font-weight="500">03  Compare before saving</text><rect x="60" y="538" width="480" height="70" rx="20" fill="#fff" stroke="#d7ddd5"/><text x="80" y="582" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#151817" font-weight="500">04  Save to your library</text><text x="32" y="725" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#083f3b" font-weight="700">No cloud AI photo upload.</text><text x="32" y="779" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#59645f" font-weight="500">Separate network services:</text><text x="32" y="817" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#59645f" font-weight="500">App Store, analytics and diagnostics.</text><text x="32" y="855" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#59645f" font-weight="500">Cloud sync follows device settings.</text></svg>